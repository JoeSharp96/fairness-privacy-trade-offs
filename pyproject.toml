[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacy-fairness-tradeoffs"
version = "1.1.3"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.31.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "opacus==1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.32.0"

[tool.flwr.app.components]
serverapp = "source.server_app:app"
clientapp = "source.client_app:app"

[tool.flwr.app.config]
# Server Params
num-server-rounds = 50
min-available-nodes = 5
fraction-evaluate = 0.2
fraction-train = 0.2
save-model = true
out-dir = "adult_non_dp.sh_1785424408"
strategy = "fedavg"

# Threat Parameters
fraction-malicious = 0.0

# Data settings
dataset = "adult"
distribution = "non-iid"
batch-size = 32
num-partitions = 5
min-partition-size = 16
alpha = 10.0
skew = 0.05
sensitive-feature = "sex"
sensitive-value = "Female"
seed = 42

# Q-FedAvg Params
q = 0.001

# Ditto Parameters
ditto = false
ditto-lr = 0.001
ditto-local-epochs = 1
ditto-lambda = 0.01

# Training Parameters
local-epochs = 1
learning-rate = 0.005

# DP Settings
dp-enabled = false
dp-mode = "local"
epsilon = 5.0
delta = 1e-5
max-grad-norm = 2.0
max-physical-batch-size = 16
clipping-mode = "flat"
clipping-lower-bound = 0.1


