[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacy-fairness-tradeoffs"
version = "1.1.3"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.31.0",
    "flwr-datasets[vision]>=0.6.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "opacus>=1.6.0",
    "toml-cli",
    "scikit-learn"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.32.0"

[tool.flwr.app.components]
serverapp = "source.server_app:app"
clientapp = "source.client_app:app"

[tool.flwr.app.config]
# Server Params
num-server-rounds = 30
min-available-nodes = 5
fraction-evaluate = 0.2
fraction-train = 0.2
save-model = true
out-dir = "adult_strict_dp.sh_1787697684"

# Data settings
dataset = "adult"
distribution = "non-iid"
batch-size = 128
num-partitions = 5
min-partition-size = 16
alpha = 0.2
skew = 0.05
target-feature = "income"
sensitive-feature = "sex"
sensitive-value = "Female"
seed = 1

# Training Parameters
local-epochs = 1
learning-rate = 0.001

# DP Settings
dp-enabled = true
epsilon = 1.0
delta = 1e-05
max-grad-norm = 1.0
max-physical-batch-size = 128


